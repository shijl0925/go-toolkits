# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-test:
    strategy:
      matrix:
        go:
          - "1.20"
          - "1.21"
          - "1.22"
          - "1.23"
          - "1.24"
          - "1.25"
          - "1.26"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vben
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vben"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Install database server
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: "8.0"
        root-password: 'root@123'
        auto-start: true

    - name: Verify setup and create database
      run: |
        echo -e '[client]\nuser = root\npassword = root@123\nhost = 127.0.0.1' > ~/.my.cnf
        mysql --defaults-file=~/.my.cnf -e 'SELECT version();'
        mysql --defaults-file=~/.my.cnf -e 'CREATE DATABASE vben;'
        PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d vben -c 'SELECT version();'

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}

    - name: Test
      run: go test -v ./...
