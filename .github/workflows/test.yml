# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-test:
    strategy:
      matrix:
        go:
          - "1.20"
          - "1.21"
          - "1.22"
          - "1.23"
          - "1.24"
    runs-on: ubuntu-latest

    steps:
    - name: Install database server
      uses: shogo82148/actions-setup-mysql@v1
      with:
        mysql-version: "8.0"
        root-password: 'root@123'
        auto-start: true

    - name: Verify setup and create database
      run: |
        echo -e '[client]\nuser = root\npassword = root@123\nhost = 127.0.0.1' > ~/.my.cnf
        mysql --defaults-file=~/.my.cnf -e 'SELECT version();'
        mysql --defaults-file=~/.my.cnf -e 'CREATE DATABASE vben;'

    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}

    - name: Test
      run: go test ./...

